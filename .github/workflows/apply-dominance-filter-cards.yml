name: Apply Dominance Filter Cards

on:
  push:
    paths:
      - '.github/workflows/apply-dominance-filter-cards.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dominance cards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx')
          s=p.read_text()

          old='''              {sortedDomCols.map(col => {\n                const dom = colDominance[col.key];\n                if (!dom) return null;\n                return (\n                  <div key={col.key} onClick={()=>setExcludedDom(prev=>{const n=new Set(prev);n.has(col.key)?n.delete(col.key):n.add(col.key);return n;})} style={{display:"flex",flexDirection:"column",alignItems:"center",background:"#0a0a0a",border:"1px solid #333",borderRadius:3,padding:"3px 8px",minWidth:44,textAlign:"center",cursor:"pointer",userSelect:"none"}}>\n'''

          new='''              {sortedDomCols.map(col => {\n                const dom = colDominance[col.key];\n                if (!dom) return null;\n                const filterTarget = col.key==="col_c1" ? {key:"coluna",val:"C1"}\n                  : col.key==="col_c2" ? {key:"coluna",val:"C2"}\n                  : col.key==="col_c3" ? {key:"coluna",val:"C3"}\n                  : ["cor","lado","altobaixo","paridade","parte","cavalo","regiao","duzia","coluna","ruaPar","setor","regtrack","fra","opo","grupoDezena"].includes(col.key)\n                    ? {key:col.key,val:dom.val}\n                    : null;\n                const selected = filterTarget ? (()=>{\n                  const cur=filterSel[filterTarget.key];\n                  return Array.isArray(cur)?cur.includes(filterTarget.val):cur===filterTarget.val;\n                })() : false;\n                return (\n                  <div key={col.key}\n                    onClick={filterTarget ? ()=>selectProbabilityFilter(filterTarget.key,filterTarget.val) : undefined}\n                    title={filterTarget ? (selected?"Clique para remover do filtro":"Clique para aplicar ao filtro") : "Sem filtro correspondente"}\n                    style={{display:"flex",flexDirection:"column",alignItems:"center",\n                      background:selected?"#102315":"#0a0a0a",\n                      border:selected?"2px solid #22c55e":"1px solid #333",\n                      boxShadow:selected?"0 0 7px #22c55e55":"none",\n                      borderRadius:3,padding:selected?"2px 7px":"3px 8px",minWidth:44,textAlign:"center",\n                      cursor:filterTarget?"pointer":"default",userSelect:"none",opacity:filterTarget?1:0.65}}>\n'''

          if old not in s:
              raise SystemExit('dominance card block not found')
          s=s.replace(old,new,1)

          old2='''                    <span style={{fontSize:11,fontWeight:"bold",color:"#fff",lineHeight:1}}>{dom.pct}%</span>\n                  </div>\n'''
          new2='''                    <span style={{fontSize:11,fontWeight:"bold",color:"#fff",lineHeight:1}}>{dom.pct}%{selected?" ✓":""}</span>\n                  </div>\n'''
          if old2 not in s:
              raise SystemExit('dominance pct marker not found')
          s=s.replace(old2,new2,1)

          p.write_text(s)
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: make dominance cards feed filters"
          git push
