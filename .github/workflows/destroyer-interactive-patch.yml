name: Destroyer interactive filters patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/destroyer-interactive-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App.jsx
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/App.jsx')
          s=p.read_text(encoding='utf-8')
          original=s

          s=s.replace('function CatalogFooterStats({ entries, terminalStats }) {','function CatalogFooterStats({ entries, terminalStats, filterSel, onSelectFilter }) {',1)
          s=s.replace('{label:"Par",   key:"par",    vals:["Par","Ímpar"],                pal:PAR_CELL},','{label:"Par",   key:"paridade", vals:["Par","Ímpar"],              pal:PAR_CELL},',1)
          s=s.replace('cor:getColor(p.num), lado:getLado(p.num), par:getParidade(p.num),','cor:getColor(p.num), lado:getLado(p.num), paridade:getParidade(p.num),',1)
          s=s.replace('if (pct >= 50) dominants.push({label,val:best.val,pct,pal:pal[best.val]||{bg:"#222",text:"#aaa"}});','if (pct >= 50) dominants.push({label,val:best.val,pct,pal:pal[best.val]||{bg:"#222",text:"#aaa"},filterKey:key});',1)
          s=s.replace('  const top5cards = dominants.slice(0,5);\n','  const top5cards = dominants.slice(0,5);\n  const cardActive=(key,val)=>{ const cur=filterSel?.[key]; return Array.isArray(cur)?cur.includes(val):cur===val; };\n',1)

          old='''        {top5cards.map(({label,val,pct,pal}) => (\n          <div key={label} style={{display:"flex",flexDirection:"column",alignItems:"center",\n            background:pal.bg,borderRadius:3,padding:"3px 7px",border:"1px solid "+pal.text+"88",minWidth:40,textAlign:"center"}}>\n            <span style={{fontSize:7,color:pal.text,opacity:0.7,textTransform:"uppercase",display:"block"}}>{label}</span>\n            <span style={{fontSize:11,fontWeight:"bold",color:pal.text,display:"block",lineHeight:1}}>{val}</span>\n            <span style={{fontSize:12,color:pal.text,fontWeight:"900",display:"block"}}>{pct}%</span>\n          </div>\n        ))}'''
          new='''        {top5cards.map(({label,val,pct,pal,filterKey}) => {\n          const active=cardActive(filterKey,val);\n          return (\n            <button key={label} type="button" onClick={()=>filterKey&&onSelectFilter?.(filterKey,val)}\n              style={{display:"flex",flexDirection:"column",alignItems:"center",background:pal.bg,borderRadius:3,padding:"3px 7px",border:active?"2px solid #FFD700":"1px solid "+pal.text+"88",boxShadow:active?"0 0 8px #FFD70088":"none",minWidth:40,textAlign:"center",cursor:filterKey?"pointer":"default",fontFamily:"Arial, sans-serif"}}>\n              <span style={{fontSize:7,color:pal.text,opacity:0.7,textTransform:"uppercase",display:"block"}}>{label}</span>\n              <span style={{fontSize:11,fontWeight:"bold",color:pal.text,display:"block",lineHeight:1}}>{val}</span>\n              <span style={{fontSize:12,color:pal.text,fontWeight:"900",display:"block"}}>{pct}%</span>\n            </button>\n          );\n        })}'''
          if old not in s: raise SystemExit('probability render anchor missing')
          s=s.replace(old,new,1)

          state_anchor='  const [showCards, setShowCards] = useState(true);\n'
          handler='''  const selectProbabilityFilter = (key,val) => {\n    const MULTI_KEYS=["duzia","coluna","grupoDezena"];\n    setFilterSel(prev=>{\n      if(MULTI_KEYS.includes(key)){\n        const cur=Array.isArray(prev[key])?prev[key]:prev[key]?[prev[key]]:[];\n        if(cur.includes(val)){ const next=cur.filter(v=>v!==val); const np={...prev}; if(next.length===0) delete np[key]; else np[key]=next; return np; }\n        if(cur.length>=2) return {...prev,[key]:[cur[1],val]};\n        return {...prev,[key]:[...cur,val]};\n      }\n      if(prev[key]===val){ const np={...prev}; delete np[key]; return np; }\n      return {...prev,[key]:val};\n    });\n  };\n'''
          if state_anchor not in s: raise SystemExit('state anchor missing')
          s=s.replace(state_anchor,state_anchor+handler,1)

          s=s.replace('            { label:"CAVALO", key:"cavalo",   vals:["369","258","147"],     pal:CAVALO_CELL },\n            { label:"OPO",    key:"opo",      vals:["ZERO","DEZ"],         pal:OPO_CELL },','            { label:"CAVALO", key:"cavalo",   vals:["369","258","147"],     pal:CAVALO_CELL },\n            { label:"ZONA",   key:"regiao",   vals:["Tier","Orphelins","Voisins"], pal:REGIAO_CELL },\n            { label:"FRA",    key:"fra",      vals:["F1e","F2e","F3e","F1d","F2d","F3d"], pal:FRA_CELL },\n            { label:"OPO",    key:"opo",      vals:["ZERO","DEZ"],         pal:OPO_CELL },',1)
          s=s.replace('            cavalo:n=>getCavalo(n), opo:n=>getOpo(n),\n            ruaPar:n=>getRuaParidade(n),','            cavalo:n=>getCavalo(n), regiao:n=>getRegiao(n), fra:n=>getFra(n), opo:n=>getOpo(n),\n            ruaPar:n=>getRuaParidade(n),',1)

          comp='''function SidebarTop50Summary({ entries }) {\n  if(!entries || entries.length<5) return null;\n  const last50=entries.slice(-50), numCnt={}, gpCnt={};\n  last50.forEach(e=>{numCnt[e.num]=(numCnt[e.num]||0)+1; if(e.gp&&e.gp!=="—") gpCnt[e.gp]=(gpCnt[e.gp]||0)+1;});\n  const top5=Object.entries(numCnt).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([n,c])=>({n:+n,c}));\n  const top2gp=Object.entries(gpCnt).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([g,c])=>({g,c}));\n  return <div style={{padding:"8px 0 6px",borderBottom:"1px solid #1a1a1a",marginBottom:6}}>\n    <div style={{fontSize:7,color:"#666",fontWeight:"bold",letterSpacing:"0.08em",marginBottom:5}}>TOP 5 ULT 50</div>\n    <div style={{display:"flex",gap:5,alignItems:"flex-end",marginBottom:7,flexWrap:"wrap"}}>{top5.map(({n,c},i)=>{const sch=NUM_BALL[getColor(n)];return <div key={n} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:1}}><span style={{fontSize:7,color:"#FFD700",fontWeight:"bold"}}>#{i+1}</span><div style={{width:25,height:25,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",background:sch.bg,border:"2px solid "+sch.border,color:sch.text,fontSize:9,fontWeight:"bold"}}>{n}</div><span style={{fontSize:7,color:"#777"}}>{c}x</span></div>})}</div>\n    <div style={{fontSize:7,color:"#666",fontWeight:"bold",letterSpacing:"0.08em",marginBottom:4}}>TOP 2 GP</div>\n    <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{top2gp.map(({g,c},i)=>{const sch=GP_CELL[g]||{bg:"#111",text:"#aaa"};return <div key={g} style={{display:"flex",alignItems:"center",gap:4,background:sch.bg,borderRadius:3,padding:"3px 7px",border:"1px solid "+sch.text+"88"}}><span style={{fontSize:7,color:sch.text,opacity:.7}}>#{i+1}</span><span style={{fontSize:10,fontWeight:"bold",color:sch.text}}>{g}</span><span style={{fontSize:8,color:sch.text,opacity:.85}}>{c}x</span></div>})}</div>\n  </div>;\n}\n\n'''
          marker='function PairCatalog({ sharedEntries }) {'
          if marker not in s: raise SystemExit('PairCatalog marker missing')
          s=s.replace(marker,comp+marker,1)
          s=s.replace('{showHistory ? "▼ Ocultar histórico da análise" : "▶ Ver histórico da análise"}\n      </button>\n      <div style={{display:showHistory?"block":"none"}}>','{showHistory ? "▼ Ocultar histórico da análise" : "▶ Ver histórico da análise"}\n      </button>\n      <SidebarTop50Summary entries={sharedEntries}/>\n      <div style={{display:showHistory?"block":"none"}}>',1)

          start='        {/* Top 5 e Top 2 GP */}'
          if start in s:
            st=s.index(start)
            en=s.index('\n\n\n\n        </>}',st)
            s=s[:st]+s[en:]

          s=s.replace('<CatalogFooterStats entries={entries} terminalStats={terminalStats}/>','<CatalogFooterStats entries={entries} terminalStats={terminalStats} filterSel={filterSel} onSelectFilter={selectProbabilityFilter}/>',1)
          if s==original: raise SystemExit('no changes')
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "OpenAI"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Probabilidades clicáveis e resumo lateral" || exit 0
          git push
