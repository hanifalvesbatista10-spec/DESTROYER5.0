name: Apply Number PUX House Logic

on:
  push:
    paths:
      - '.github/workflows/apply-number-pux-house.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CASA logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/App.jsx')
          s = p.read_text()

          start = s.find('function analyzeCasaPuxada(puxouList) {')
          end = s.find('\nconst MICRO_GROUPS = {', start)
          if start == -1 or end == -1:
              raise SystemExit('analyzeCasaPuxada markers not found')

          new_fn = r'''function analyzeCasaPuxada(puxouList) {
  if (!puxouList || puxouList.length < 5) return null;

  // CASA passa a olhar EXATAMENTE os últimos 5 números que o número da linha puxou (coluna PUX).
  const ultimos5 = puxouList.slice(-5);
  const casas = ["0", "10", "20", "30"];

  // Um vizinho numérico de cada lado da faixa da casa.
  // Nas extremidades fazemos a volta 0↔36 para manter 1 vizinho por lado.
  const limites = {
    "0":  {min:0,  max:9,  viz:[36,10]},
    "10": {min:10, max:19, viz:[9,20]},
    "20": {min:20, max:29, viz:[19,30]},
    "30": {min:30, max:36, viz:[29,0]},
  };

  const stats = casas.map(casa => {
    const lim = limites[casa];
    let dentro = 0;
    let vizinhos = 0;
    const numsDentro = [];
    const numsVizinhos = [];

    ultimos5.forEach(h => {
      const n = h.num;
      if (n >= lim.min && n <= lim.max) {
        dentro++;
        numsDentro.push(n);
      } else if (lim.viz.includes(n)) {
        vizinhos++;
        numsVizinhos.push(n);
      }
    });

    return {
      casa,
      dentro,
      vizinhos,
      apoio: dentro + vizinhos,
      total: 5,
      pct: Math.round((dentro / 5) * 100),
      apoioPct: Math.round(((dentro + vizinhos) / 5) * 100),
      numsDentro,
      numsVizinhos,
    };
  });

  // Regra principal: a casa precisa ser maioria real dos últimos 5 (mínimo 3/5).
  // Os vizinhos servem como reforço, mas não criam uma maioria que não existe.
  const ranking = stats
    .filter(x => x.dentro >= 3)
    .sort((a,b) => b.dentro - a.dentro || b.vizinhos - a.vizinhos);

  if (!ranking.length) return null;
  return ranking[0];
}
'''
          s = s[:start] + new_fn + s[end:]

          old = '''                        const casaOrigem = e.grupoDezena || getGrupoDezena(e.num);\n                        const ultimosPuxadosDaCasa = getHistoricoCasaUltimos5(entries, realIndex, casaOrigem);\n                        const result = analyzeCasaPuxada(ultimosPuxadosDaCasa);'''
          new = '''                        const ultimosPuxadosDoNumero = getHistorico(entries, realIndex, e.num);\n                        const result = analyzeCasaPuxada(ultimosPuxadosDoNumero);'''
          if old not in s:
              raise SystemExit('viz source block not found')
          s = s.replace(old, new, 1)

          old_title = 'title={result ? `Casa ${casaOrigem} puxou a casa ${result.casa} em ${result.count}/${result.total} das últimas situações` : "Sem histórico suficiente"}'
          new_title = 'title={result ? `Nº ${e.num}: CASA ${result.casa} em ${result.dentro}/5 dos últimos PUX` + (result.vizinhos ? ` + ${result.vizinhos} vizinho(s) de borda` : "") : "Sem maioria de CASA nos últimos 5 PUX"}'
          if old_title not in s:
              raise SystemExit('viz title marker not found')
          s = s.replace(old_title, new_title, 1)

          old_stat = '<span style={{fontSize:6,lineHeight:1,opacity:0.95}}>{result.count}/{result.total} · {result.pct}%</span>'
          new_stat = '<span style={{fontSize:6,lineHeight:1,opacity:0.95}}>{result.dentro}/5 · {result.pct}%{result.vizinhos>0?` +${result.vizinhos}V`:""}</span>'
          if old_stat not in s:
              raise SystemExit('viz stat marker not found')
          s = s.replace(old_stat, new_stat, 1)

          p.write_text(s)
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: evaluate CASA from last five number pulls"
          git push
