name: Patch Destroyer UI Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-ui-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted UI/probability patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text(encoding='utf-8')

          # 1) Probability: add CASA and R/P fields.
          old = '''      {label:"FRA",   key:"fra",    vals:["F1e","F2e","F3e","F1d","F2d","F3d"], pal:FRA_CELL},\n      {label:"OPO",   key:"opo",    vals:["ZERO","DEZ"],                        pal:OPO_CELL},\n'''
          new = '''      {label:"FRA",   key:"fra",    vals:["F1e","F2e","F3e","F1d","F2d","F3d"], pal:FRA_CELL},\n      {label:"OPO",   key:"opo",    vals:["ZERO","DEZ"],                        pal:OPO_CELL},\n      {label:"Casa",  key:"grupoDezena", vals:["0","10","20","30"],            pal:GRUPO_DEZENA_CELL},\n      {label:"R/P",   key:"ruaPar", vals:["R.Ímpar","R.Par"],                     pal:RUA_PAR_CELL},\n'''
          if old not in s:
              raise SystemExit('Probability field anchor not found')
          s = s.replace(old, new, 1)

          old = '''        cor:getColor(p.num), lado:getLado(p.num), par:getParidade(p.num),\n        parte:getParte(p.num), duzia:getDuzia(p.num), regiao:getRegiao(p.num), cavalo:getCavalo(p.num)\n'''
          new = '''        cor:getColor(p.num), lado:getLado(p.num), par:getParidade(p.num),\n        parte:getParte(p.num), duzia:getDuzia(p.num), regiao:getRegiao(p.num), cavalo:getCavalo(p.num),\n        fra:getFra(p.num), opo:getOpo(p.num), grupoDezena:getGrupoDezena(p.num), ruaPar:getRuaParidade(p.num)\n'''
          if old not in s:
              raise SystemExit('Probability object anchor not found')
          s = s.replace(old, new, 1)

          # 2) PairCatalog: keep engine/data active, but collapse the large history visually by default.
          old = '''function PairCatalog({ sharedEntries }) {\n  const [catalog, setCatalog] = useState({});\n'''
          new = '''function PairCatalog({ sharedEntries }) {\n  const [catalog, setCatalog] = useState({});\n  const [showHistory, setShowHistory] = useState(false);\n'''
          if old not in s:
              raise SystemExit('PairCatalog state anchor not found')
          s = s.replace(old, new, 1)

          old = '''  return (\n    <div style={{padding:"12px 16px",background:"#0d0d0d",display:"flex",flexDirection:"column",minHeight:"100vh"}}>\n      {queryNum !== null && (\n'''
          new = '''  return (\n    <div style={{padding:"12px 16px",background:"#0d0d0d",display:"flex",flexDirection:"column",minHeight:"100%"}}>\n      <button\n        type="button"\n        onClick={()=>setShowHistory(v=>!v)}\n        style={{alignSelf:"stretch",marginBottom:showHistory?8:0,padding:"5px 8px",background:"#0a0a0a",border:"1px solid #262626",borderRadius:3,color:showHistory?"#aaa":"#666",fontSize:8,fontWeight:"bold",letterSpacing:"0.08em",cursor:"pointer",textTransform:"uppercase"}}\n      >\n        {showHistory ? "▼ Ocultar histórico da análise" : "▶ Ver histórico da análise"}\n      </button>\n      <div style={{display:showHistory?"block":"none"}}>\n      {queryNum !== null && (\n'''
          if old not in s:
              raise SystemExit('PairCatalog return anchor not found')
          s = s.replace(old, new, 1)

          old = '''      )}\n    </div>\n  );\n}\n\nfunction SignalsPanel'''
          new = '''      )}\n      </div>\n    </div>\n  );\n}\n\nfunction SignalsPanel'''
          if old not in s:
              raise SystemExit('PairCatalog closing anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "OpenAI"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Ocultar histórico e ampliar probabilidades" || exit 0
          git push
