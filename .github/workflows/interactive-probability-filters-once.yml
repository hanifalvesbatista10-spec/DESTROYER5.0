name: Interactive probability filters once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/interactive-probability-filters-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused Destroyer patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text(encoding='utf-8')

          s = s.replace('function CatalogFooterStats({ entries, terminalStats }) {','function CatalogFooterStats({ entries, terminalStats, filterSel, onSelectFilter }) {',1)
          s = s.replace('{label:"Par",   key:"par",    vals:["Par","Ímpar"],                pal:PAR_CELL},','{label:"Par",   key:"paridade", vals:["Par","Ímpar"],              pal:PAR_CELL},',1)
          s = s.replace('cor:getColor(p.num), lado:getLado(p.num), par:getParidade(p.num),\n        parte:getParte(p.num)','cor:getColor(p.num), lado:getLado(p.num), paridade:getParidade(p.num),\n        parte:getParte(p.num)',1)
          s = s.replace('dominants.push({label,val:best.val,pct,pal:pal[best.val]||{bg:"#222",text:"#aaa"}});','dominants.push({label,val:best.val,pct,pal:pal[best.val]||{bg:"#222",text:"#aaa"},filterKey:key});',1)

          old = '''  return (\n    <div style={{borderTop:"2px solid #1e1e1e",padding:"8px 12px",background:"#080808",flexShrink:0}}>\n      <div style={{fontSize:7,letterSpacing:"0.1em",color:"#555",textTransform:"uppercase",marginBottom:6}}>PROBABILIDADE</div>\n      <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>\n        {top5cards.map(({label,val,pct,pal}) => (\n          <div key={label} style={{display:"flex",flexDirection:"column",alignItems:"center",\n            background:pal.bg,borderRadius:3,padding:"3px 7px",border:"1px solid "+pal.text+"88",minWidth:40,textAlign:"center"}}>\n            <span style={{fontSize:7,color:pal.text,opacity:0.7,textTransform:"uppercase",display:"block"}}>{label}</span>\n            <span style={{fontSize:11,fontWeight:"bold",color:pal.text,display:"block",lineHeight:1}}>{val}</span>\n            <span style={{fontSize:12,color:pal.text,fontWeight:"900",display:"block"}}>{pct}%</span>\n          </div>\n        ))}\n      </div>\n    </div>\n  );\n}\n'''
          new = '''  const cardActive = (key,val) => {\n    if(!key) return false;\n    const cur = filterSel?.[key];\n    return Array.isArray(cur) ? cur.includes(val) : cur === val;\n  };\n\n  return (\n    <div style={{borderTop:"2px solid #1e1e1e",padding:"8px 12px",background:"#080808",flexShrink:0}}>\n      <div style={{fontSize:7,letterSpacing:"0.1em",color:"#555",textTransform:"uppercase",marginBottom:6}}>PROBABILIDADE · CLIQUE PARA FILTRAR</div>\n      <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>\n        {top5cards.map(({label,val,pct,pal,filterKey}) => {\n          const active = cardActive(filterKey,val);\n          return (\n            <button key={label} type="button" onClick={()=>filterKey && onSelectFilter?.(filterKey,val)}\n              title={filterKey ? "Aplicar/remover este filtro" : "Informação analítica"}\n              style={{display:"flex",flexDirection:"column",alignItems:"center",background:pal.bg,borderRadius:3,padding:"3px 7px",border:active ? "2px solid #FFD700" : "1px solid "+pal.text+"88",boxShadow:active ? "0 0 8px #FFD70088" : "none",minWidth:40,textAlign:"center",cursor:filterKey?"pointer":"default",fontFamily:"Arial, sans-serif"}}>\n              <span style={{fontSize:7,color:pal.text,opacity:0.7,textTransform:"uppercase",display:"block"}}>{label}</span>\n              <span style={{fontSize:11,fontWeight:"bold",color:pal.text,display:"block",lineHeight:1}}>{val}</span>\n              <span style={{fontSize:12,color:pal.text,fontWeight:"900",display:"block"}}>{pct}%</span>\n            </button>\n          );\n        })}\n      </div>\n    </div>\n  );\n}\n'''
          if old not in s: raise SystemExit('CatalogFooterStats render anchor not found')
          s = s.replace(old,new,1)

          state_anchor = '  const [showCards, setShowCards] = useState(true);\n\n'
          handler = '''  const selectProbabilityFilter = (key, val) => {\n    const MULTI_KEYS = ["duzia","coluna","grupoDezena"];\n    setFilterSel(prev => {\n      if (MULTI_KEYS.includes(key)) {\n        const cur = Array.isArray(prev[key]) ? prev[key] : prev[key] ? [prev[key]] : [];\n        if (cur.includes(val)) { const next=cur.filter(v=>v!==val); const np={...prev}; if(next.length===0) delete np[key]; else np[key]=next; return np; }\n        if (cur.length>=2) return {...prev,[key]:[cur[1],val]};\n        return {...prev,[key]:[...cur,val]};\n      }\n      if (prev[key]===val) { const np={...prev}; delete np[key]; return np; }\n      return {...prev,[key]:val};\n    });\n  };\n\n'''
          if state_anchor not in s: raise SystemExit('App state anchor not found')
          s = s.replace(state_anchor,state_anchor+handler,1)

          s = s.replace('            { label:"CAVALO", key:"cavalo",   vals:["369","258","147"],     pal:CAVALO_CELL },\n            { label:"OPO",    key:"opo",      vals:["ZERO","DEZ"],         pal:OPO_CELL },','            { label:"CAVALO", key:"cavalo",   vals:["369","258","147"],     pal:CAVALO_CELL },\n            { label:"ZONA",   key:"regiao",   vals:["Tier","Orphelins","Voisins"], pal:REGIAO_CELL },\n            { label:"FRA",    key:"fra",      vals:["F1e","F2e","F3e","F1d","F2d","F3d"], pal:FRA_CELL },\n            { label:"OPO",    key:"opo",      vals:["ZERO","DEZ"],         pal:OPO_CELL },',1)
          s = s.replace('            cavalo:n=>getCavalo(n), opo:n=>getOpo(n),\n            ruaPar:n=>getRuaParidade(n),','            cavalo:n=>getCavalo(n), regiao:n=>getRegiao(n), fra:n=>getFra(n), opo:n=>getOpo(n),\n            ruaPar:n=>getRuaParidade(n),',1)

          pair_anchor='function PairCatalog({ sharedEntries }) {'
          sidebar_component=r'''function SidebarTop50Summary({ entries }) {
  if(!entries || entries.length < 5) return null;
  const last50=entries.slice(-50), numCnt={}, gpCnt={};
  last50.forEach(e=>{ numCnt[e.num]=(numCnt[e.num]||0)+1; if(e.gp&&e.gp!=="—") gpCnt[e.gp]=(gpCnt[e.gp]||0)+1; });
  const top5=Object.entries(numCnt).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([n,c])=>({n:parseInt(n),c}));
  const top2gp=Object.entries(gpCnt).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([g,c])=>({g,c}));
  return (
    <div style={{padding:"8px 0 6px",borderBottom:"1px solid #1a1a1a",marginBottom:6}}>
      <div style={{display:"flex",alignItems:"flex-end",gap:5,flexWrap:"wrap",marginBottom:7}}>
        <span style={{fontSize:7,color:"#666",fontWeight:"bold",letterSpacing:"0.08em",width:"100%"}}>TOP 5 ULT 50</span>
        {top5.map(({n,c},i)=>{ const cor=getColor(n); const sch=NUM_BALL[cor]; return <div key={n} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:1}}><span style={{fontSize:7,color:"#FFD700",fontWeight:"bold"}}>#{i+1}</span><div style={{width:25,height:25,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",background:sch.bg,border:"2px solid "+sch.border,color:sch.text,fontSize:9,fontWeight:"bold"}}>{n}</div><span style={{fontSize:7,color:"#777"}}>{c}x</span></div>;})}
      </div>
      <div style={{display:"flex",alignItems:"center",gap:4,flexWrap:"wrap"}}>
        <span style={{fontSize:7,color:"#666",fontWeight:"bold",letterSpacing:"0.08em",width:"100%"}}>TOP 2 GP</span>
        {top2gp.map(({g,c},i)=>{ const sch=GP_CELL[g]||{bg:"#111",text:"#aaa"}; return <div key={g} style={{display:"flex",alignItems:"center",gap:4,background:sch.bg,borderRadius:3,padding:"3px 7px",border:"1px solid "+sch.text+"88"}}><span style={{fontSize:7,color:sch.text,opacity:.7}}>#{i+1}</span><span style={{fontSize:10,fontWeight:"bold",color:sch.text}}>{g}</span><span style={{fontSize:8,color:sch.text,opacity:.85}}>{c}x</span></div>;})}
      </div>
    </div>
  );
}

'''
          if pair_anchor not in s: raise SystemExit('PairCatalog anchor not found')
          s=s.replace(pair_anchor,sidebar_component+pair_anchor,1)
          oldbtn='''      >\n        {showHistory ? "▼ Ocultar histórico da análise" : "▶ Ver histórico da análise"}\n      </button>\n      <div style={{display:showHistory?"block":"none"}}>'''
          newbtn='''      >\n        {showHistory ? "▼ Ocultar histórico da análise" : "▶ Ver histórico da análise"}\n      </button>\n      <SidebarTop50Summary entries={sharedEntries}/>\n      <div style={{display:showHistory?"block":"none"}}>'''
          if oldbtn not in s: raise SystemExit('History button anchor not found')
          s=s.replace(oldbtn,newbtn,1)

          start='        {/* Top 5 e Top 2 GP */}'
          if start in s:
            st=s.index(start); marker='\n\n\n\n        </>}'; en=s.index(marker,st); s=s[:st]+s[en:]

          s=s.replace('<CatalogFooterStats entries={entries} terminalStats={terminalStats}/>','<CatalogFooterStats entries={entries} terminalStats={terminalStats} filterSel={filterSel} onSelectFilter={selectProbabilityFilter}/>',1)
          p.write_text(s,encoding='utf-8')

      - name: Commit focused patch
        run: |
          git config user.name "OpenAI"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Tornar probabilidades clicáveis e mover resumo para lateral" || exit 0
          git push

# trigger 2
